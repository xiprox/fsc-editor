# Merged from bksq-aircraft-bonanzaproturbine.yaml and its 13 includes.
# Each section below was one of those files.

include:
  - modules/PMS50_GTN_650-750.yaml
  - modules/AS_GNS430.yaml
  - modules/AS_GNS530.yaml
  - modules/fuel.yaml
  - modules/payload.yaml
  - modules/bksq_bendix_rdr1150xl.yaml
  - modules/bksq_kfc_150.yaml

master:
  # ═══ SWITCHES ═════════════════════════════════════════════════════════════
  # Parking Brake
  - get: L:ParkingBrake_Position, Number
    set: |
      value
        ? '(L:ParkingBrake_Position, Number) 0 == if{ (>B:LANDING_GEAR_ParkingBrake_Toggle) }'
        : '(L:ParkingBrake_Position, Number) 100 == if{ (>B:LANDING_GEAR_ParkingBrake_Toggle) }'

shared:
  # ═══ GENERAL ══════════════════════════════════════════════════════════════
  - get: L:var_oxygenPressure
  - get: L:var_PulseOxyPercent

  # ═══ BREAKERS ═════════════════════════════════════════════════════════════
  # Architecture notes:
  #   - Standard breakers use A:CIRCUIT CONNECTION ON:<N>, Bool as ground truth.
  #     This reflects the physical breaker position, independent of upstream bus state.
  #   - Bus relay breakers (LandingGearRelay, FlapRelay, AvionicsPowerRelay) use
  #     L:var_<NODE_ID>_readonly because reading A:BUS CONNECTION ON requires setting
  #     A:BUS LOOKUP INDEX first, which isn't doable in a plain FSCopilot get: field.
  #     The _readonly lvar is written by the model's animation code and faithfully
  #     mirrors the bus connection state.
  #   - Multi-circuit breakers (PanelLights=4 circuits, CabinLights=6 circuits)
  #     use the first sub-circuit as the representative state for get:. The set:
  #     guards each sub-circuit independently in case they ever diverge.
  #
  # Key event reference:
  #   - Circuit breakers:  <CIRCUIT_ID> <BUS_ID> (>K:2:ELECTRICAL_BUS_TO_CIRCUIT_CONNECTION_TOGGLE)
  #   - Bus relay breakers: <DEST_BUS> <SRC_BUS> (>K:2:ELECTRICAL_BUS_TO_BUS_CONNECTION_TOGGLE)
  #
  # Bus ID mapping (from INT.XML macros):
  #   HotBatteryBus=1  MainBus=2  AvionicsBus=3  FlapBus=4
  #   IntermediateAvionicsBus=5  GearBus=6  RetractableLightsBus=7
  #   AlternatorBus1=8  AlternatorBus2=9  NoWingletsBus=10  WingletsBus=11

  # ── HOT BATTERY BUS ───────────────────────────────────────────────────────

  # CB - Starter Relay — Circuit 1 / HotBatteryBus(1) — EXPORT_LVAR
  - get: A:CIRCUIT CONNECTION ON:1, Bool
    set: >
      value
        ? '(A:CIRCUIT CONNECTION ON:1, Bool) 0 == if{ 1 1 (>K:2:ELECTRICAL_BUS_TO_CIRCUIT_CONNECTION_TOGGLE) }'
        : '(A:CIRCUIT CONNECTION ON:1, Bool) 1 == if{ 1 1 (>K:2:ELECTRICAL_BUS_TO_CIRCUIT_CONNECTION_TOGGLE) }'

  # ── MAIN BUS ──────────────────────────────────────────────────────────────

  # CB - Aux Fuel Pump — Circuit 4 / MainBus(2)
