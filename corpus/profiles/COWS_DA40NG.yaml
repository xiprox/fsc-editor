#How2
#-Spawn
#-Ensure electric master is off and connect with your friend. The Master aircraft will send its configuration to the slave aircraft.
#-After powering on the aircraft, a CAS advisory message will display which config is being used. 

include:
  - modules/AS_G1000_NXi.yaml
  
master:
    #THROTTLE
    - get: A:GENERAL ENG THROTTLE LEVER POSITION:1, Position 16k

    #Fuel and weight
    - get: A:FUEL TANK LEFT MAIN QUANTITY, gallons
    - get: A:FUEL TANK RIGHT MAIN QUANTITY, gallons
    - get: L:FUEL_TEMP_C:1
    - get: L:FUEL_TEMP_C:2
    - get: A:PAYLOAD STATION WEIGHT:1, pounds
    - get: A:PAYLOAD STATION WEIGHT:2, pounds
    - get: A:PAYLOAD STATION WEIGHT:3, pounds
    - get: A:PAYLOAD STATION WEIGHT:4, pounds
    - get: A:PAYLOAD STATION WEIGHT:5, pounds

    #Config
    - get: L:FSC_FAILURES_MODE
    - get: L:FSC_FAILURES_TIMER
    - get: L:FSC_DAMAGE_ENABLED
    - get: L:FSC_REALISTIC_PARKING_BRAKE

    - get: L:FSC_SPREAD_THERMO:1
    - get: L:FSC_OP_SPREAD_BYPASS:1
    - get: L:FSC_OP_SPREAD:1
    - get: L:FSC_OP_SPREAD_COOLING:1
    - get: L:FSC_SPREAD_MAX_RPM:1
    - get: L:FSC_SPREAD_ALT
    - get: L:FSC_SPREAD_AIR
    - get: L:FSC_SPREAD_ALT_OFF
    - get: L:FSC_SYNC

    #Engine
    - get: L:WC_TEMP_BLOCK:1
    - get: L:WC_TEMP_WATER:1
    - get: L:WC_THERMOSTAT:1 
    - get: L:WC_TEMP_OIL:1
    - get: L:WC_TEMP_RAD:1
    - get: L:GC_GEARBOX_TEMPERATURE:2
    - get: L:START_GLOW_TEMP:1
    #- get: L:FUEL_PRESS:1
    - get: L:FUEL_PRIME:1
    - get: L:FUEL_PRIME_PRIMED:1
    - get: L:HEALTH_BLOCK:1
    - get: L:DAMAGE_TURBO_FRIC:1
    - get: L:HEALTH_OIL:1
    - get: L:HEALTH_FUEL:11
    - get: L:HEALTH_FUEL:12
    - get: L:HEALTH_FUEL:1
    - get: L:DAMAGE_FUEL_OSCI:1

    #Engine Sensors
    #- get: L:WC_TEMP_WATER_SENS:1
    #- get: L:WC_TEMP_OIL_SENS:1
    #- get: L:WC_TEMP_GC_SENS:1
    #- get: L:FUEL_PRESS_SENS:1

    #Elec
    - get: L:ELEC_BATT_CAPACITY
    - get: L:ELEC_BATT_TEMP
    - get: L:ELEC_BATT_ECU_CAPACITY
    - get: L:ELEC_BATT_EMER_CAPACITY

    #ECUs
    - get: L:FADEC_START_ECU_A:1
    - get: L:FADEC_START_ECU_B:1
    - get: L:FADEC_ECU_FAIL_A:1
    - get: L:FADEC_ECU_FAIL_B:1
    - get: L:FADEC_ECU_FAIL_TIME_A:1
    - get: L:FADEC_ECU_FAIL_TIME_B:1
    - get: L:FADEC_ECU_FAIL_LATCH_A:1
    - get: L:FADEC_ECU_FAIL_LATCH_B:1

    #AFCS
    - get: L:AFCS_FORCE_AIL
    - get: L:AFCS_FORCE_ELE
    - get: L:AFCS_FORCE_RUD
    - get: L:AFCS_POWER

    #Other
    - get: L:PITOT_TEMP
    - get: L:FILTER_RESRTICTION
    # - get: L:FUEL_TOTALISER
    # - get: L:FUEL_TOT_USED

shared:

    #Flight controls
    - get: L:INPUT_AILERON, Percent
      set: (>L:FSC_AIL)
    - get: L:INPUT_ELEVATOR, Percent
      set: (>L:FSC_ELE)
    - get: L:FSC_BR1_IN
      set: (>L:FSC_BR1)
    - get: L:FSC_BR2_IN
      set: (>L:FSC_BR2)  
    - get: L:INPUT_TRIM_AXIS

    #Systems
    - get: L:COWS_MINIMUMS_ALTITUDE
    - get: L:COWS_TIMER_EXP
    - get: L:INPUT_AP_DISC
    - get: L:WT_TOGA_ACTIVE
      set: (>K:AUTO_THROTTLE_TO_GA)
    - get: L:G1000_REV_FORCE

    #Damage
    - get: L:DAMAGE_BLOCK:1
    - get: L:DAMAGE_TURBO:1
    - get: L:DAMAGE_OIL:1
    - get: L:DAMAGE_FUEL:11
    - get: L:DAMAGE_FUEL:12
    - get: L:DAMAGE_FUEL:1
    - get: L:ENG_COOLANT_LEAK:1
    - get: L:GENERAL ENG FAILED:1
    - get: L:RECIP ENG TURBOCHARGER FAILED:1
    - get: A:GENERAL ENG FAILED:1, Bool
    - get: A:RECIP ENG COOLANT RESERVOIR PERCENT:1, Number
    - get: A:ENG ON FIRE:1, Bool

    #Resets 
    - get: L:RESET_ALL
    - get: L:RESET_FAILURES
    - get: L:RESET_DAMAGE
    - get: L:RESET_BATT
    - get: L:RESET_ECU

    #Switches
    #Center Console (back to front)
    - get: L:FUEL_SELECTOR_WIRE_CUT
    - get: L:FUEL_SELECTOR
    - get: L:INPUT_PARK
    - get: L:ENGINE_ALTERNATE_AIR

    #Lower switches (right to left)
    - get: A:FLAPS HANDLE INDEX, Number
    - get: A:PITOT HEAT SWITCH:1, Bool
      set: "`1 ${value} (>K:2:PITOT_HEAT_SET)`"
    - get: L:XFER_SWITCH
    - get: A:ELECTRICAL MASTER BATTERY:1, Bool
    - get: L:FSC_STARTER
    - get: A:AVIONICS MASTER SWITCH, Bool
      set: (>K:AVIONICS_MASTER_1_SET)
    - get: L:ESS_BUS_SWITCH
    - get: A:ALTERNATE STATIC SOURCE OPEN, Bool
      set: (>K:TOGGLE_ALTERNATE_STATIC)

    #ECU panel
    - get: A:GENERAL ENG FUEL PUMP SWITCH EX1:1, Bool
      set: (>K:ELECT_FUEL_PUMP1_SET)
    - get: L:ECU_VOTER:1
    - get: L:ECU_TEST:1_IsDown
    - get: L:MASTER_COVER:1
    - get: A:RECIP ENG ENGINE MASTER SWITCH:1, Bool
      set: (>K:ENGINE_MASTER_1_SET)

    #Upper switches (left to right)
    - get: L:LIGHTING_PANEL_1
      set: (>B:LIGHTING_PANEL_1_Set)
    - get: L:LIGHTING_GLARESHIELD_1
      set: (>B:LIGHTING_GLARESHIELD_1_Set)
    - get: A:LIGHT LANDING, Bool
    - get: A:LIGHT TAXI, Bool
    - get: A:LIGHT NAV, Bool
    - get: A:LIGHT STROBE, Bool
    - get: L:EMERGENCY_BATT_COVER
    - get: L:EMERGENCY_BATT
    - get: L:ATT_CAGE
    - get: L:ATT_CAGE_IsDown
    - get: L:KOHLSMAN SETTING HG:2

    #CBs
