  # ═══ FAILURES ═════════════════════════════════════════════════════════════
  #
  # Design: mirror-on-trigger. Both machines run their own failure generator at
  # whatever rate is set on the tablet (default 1x). Whenever a failure
  # activates or clears on one side, the other side is driven to match.
  #
  # Mechanism: the Black Square tablet owns all failure state in a JS array
  # (failureMatrix) and re-asserts it every 10 s. Its only external API is
  # H:BKSQ_FAILURE_<NAME>, which *toggles* the matching row — there is no
  # set/clear. So each entry below watches the variable the tablet writes when
  # the failure applies, and on an edge fires the peer's toggle.
  #
  # The `if (!!value === !!current) return ''` guard is what makes this safe:
  #   - it makes the mirror edge-triggered rather than level-triggered, and
  #   - it makes it idempotent, so if both sides happen to fail the same item
  #     independently the incoming edge is swallowed instead of toggling the
  #     peer back to healthy.
  # Do not remove it from any entry.
  #
  # Recovery: if the two matrices ever fall out of phase, every subsequent
  # mirror is inverted and stays wrong. `(>H:BKSQ_FAILURE_RESET_ALL_FAILURES)`
  # on both machines clears everything and re-establishes a common baseline.
  # Worth doing at the start of a session; there is no way to trigger it from
  # this file.
  #
  # Failure rate is a persisted LocalVar and is deliberately NOT synced —
  # syncing it would only make both generators agree on how fast to roll their
  # own independent dice, which is what this design already assumes. Set it by
  # hand on the tablet if you want both sides at the same rate.
  #   - get: L:var_globalFailureRate, Number
  #
  # Circuit/bus failures (~60 of them) are NOT mirrored as toggles. The tablet
  # applies those by disconnecting the circuit, which is indistinguishable from
  # a pulled breaker and already propagates through the CIRCUIT CONNECTION ON
  # entries in the breakers section; adding toggles here would give the peer a
  # second, competing authority over the same circuits. The peer's tablet won't
  # list the failure, but the electrical effect is correct both ways. The 18
  # failure circuits that have no cockpit breaker are picked up at the end of
  # this section instead.
  #
  # Also NOT covered here, on purpose:
  #   - Fuel leaks (L/R FUEL LEAK). The tablet drains the tank directly; the
  #     quantity propagates via modules/fuel.yaml.
  #   - Pitot blockage, static blockage, L/R brake, full instrument air. These
  #     are fired as bare K: events with no reliable read-back variable, so
  #     there is nothing to watch. See the "type 5" note at the bottom.

  # ── ENGINE FAILURES ───────────────────────────────────────────────────────
  # Note: an engine at 100 damage is failed by the model itself, and the tablet
  # will not clear a failure on an engine whose damage is still >=100 — so a
  # mirrored "repair" of that engine is a no-op until damage is reset.

  - get: A:ENG FAILED:1, Bool
    set: >
      (() => {
        if (!!value === !!current) return '';
        return '(>H:BKSQ_FAILURE_L_ENGINE_FAILURE)';
      })()

