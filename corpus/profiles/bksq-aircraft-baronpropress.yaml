  # Decision Height
  - get: A:DECISION HEIGHT
    set: >
      (() => {
        // A:DECISION HEIGHT has no absolute setter that I could find.
        // Inc/dec events step in 3.048 (= 10ft; the simvar is stored natively in meters).
        // We compute the delta between the pilot's value and the copilot's current value,
        // divide by the step size to get the number inc/dec calls needed, then emit
        // exactly that many calls as a flat RPN string. Inc/dec event writes accumulate 
        // within a single RPN execution, so N calls = N * 3.048m of movement. 
        // Max 250 calls (full range).

        const stepSize = 3.048; // 10 feet in meters
        const steps = Math.round((value - current) / stepSize);
        if (steps === 0) return '';
        const event = steps > 0
          ? '1 (>B:NAVCOM_Decision_Height_Inc, number)'
          : '1 (>B:NAVCOM_Decision_Height_Dec, number)';
        return Array(Math.abs(steps)).fill(event).join(' ');
      })()

