  # UNVERIFIED — if PARTIAL PANEL VACUUM never moves, this entry is simply
  # inert and does no harm; delete it then. Check by failing INSTRUMENT AIR
  # from the tablet and watching the variable. Unlike the A:SUCTION PRESSURE
  # heuristic this replaces, it should not track engine state, so it cannot
  # produce the spurious start/shutdown edges that one did.
