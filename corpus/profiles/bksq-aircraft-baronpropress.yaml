  # bksq-aircraft-baronpropress — Circuit Breakers
  #
  # Source: BaronProfessional_Base_INT.xml (baronpropress inherits from baronpro base)
  #
  # Bus ID mapping:
  #   HotBatteryBus=1  MainBus=2  AvionicsBus=3  FlapBus=4
  #   IntermediateAvionicsBus=5  GearBus=6  RetractableLightsBus=7
  #   AlternatorBus1=8  AlternatorBus2=9  WingletsBus=10  NoWingletsBus=11
  #
  # Notes:
  #   - Bus relay breakers (LandingGearRelay, FlapRelay, AvionicsPowerRelay) use
  #     L:var_Breaker_*_readonly as sensor — A:BUS CONNECTION ON requires
  #     BUS LOOKUP INDEX and is not usable standalone as a get:.
  #   - Multi-circuit physical CBs (TEMPLATE_2, MULTI_6) use one entry per
  #     sub-circuit rather than a chained multi-K: approach (more reliable).
  #   - Soft circuits with no physical CB node (omitted):
  #     2 (GeneralPanel), 8 (GearMonitor), 29 (PitotHeat L), 30 (PropHeat),
  #     35 (WindshieldHeat), 37 (PitotHeat R), 38 (FuelVentHeat),
  #     39 (StallWarningHeat), 40 (StrobeLight Winglets), 41 (BeaconLight),
  #     42 (NavLights Winglets), 43 (TaxiLights), 44 (LandingLights L),
  #     55 (YokeLight1), 56 (YokeLight2), 57 (LandingLights R), 58 (IceLight),
  #     59 (GeneralAvionics), 62 (GyroSlaving), 65/66 (Com3/4 internal),
  #     70 (Nav4 internal), 81/82 (MarkerBeacon internal),
  #     86 (Strobe NoWinglets), 87 (Nav NoWinglets)

  # ── HOT BATTERY BUS ───────────────────────────────────────────────────────

  # CB - Starter (L+R) — Circuits 1+32 / HotBatteryBus(1) — TEMPLATE_2
  - get: A:CIRCUIT CONNECTION ON:1, Bool
    set: >
      value
        ? '(A:CIRCUIT CONNECTION ON:1, Bool) 0 == if{ 1 1 (>K:2:ELECTRICAL_BUS_TO_CIRCUIT_CONNECTION_TOGGLE) }'
        : '(A:CIRCUIT CONNECTION ON:1, Bool) 1 == if{ 1 1 (>K:2:ELECTRICAL_BUS_TO_CIRCUIT_CONNECTION_TOGGLE) }'

  - get: A:CIRCUIT CONNECTION ON:32, Bool
    set: >
      value
        ? '(A:CIRCUIT CONNECTION ON:32, Bool) 0 == if{ 32 1 (>K:2:ELECTRICAL_BUS_TO_CIRCUIT_CONNECTION_TOGGLE) }'
        : '(A:CIRCUIT CONNECTION ON:32, Bool) 1 == if{ 32 1 (>K:2:ELECTRICAL_BUS_TO_CIRCUIT_CONNECTION_TOGGLE) }'

