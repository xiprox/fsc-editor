  # Strobe and nav lights are wired to different circuits per variant. The
  # tablet selects them with `this.turbocharged ? 40 : 86` — and the
  # pressurised 58P has BKSQ_Turbocharged=1 (see its .flt files), so THIS
  # aircraft uses the winglet circuits 40 and 42 on bus 10. Circuits 86/87 on
  # bus 11 are the normally-aspirated Baron's. All four are defined in every
  # variant's systems.cfg, so keeping both pairs here costs nothing and makes
  # this block portable to bksq-aircraft-baronpro without edits — the unused
  # pair simply never changes.

  # Strobe Light (winglets) — Circuit 40 / Bus 10 — turbo + pressurised
  - get: A:CIRCUIT CONNECTION ON:40, Bool
