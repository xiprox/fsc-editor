    set: "`${value} (>B:INSTRUMENT_HEADING_BUG_Set)`"

  # NAV 2 OBS
  - get: A:NAV OBS:2, Degrees
    set: >
      (() => {
        let delta = value - current;
        if (delta > 180) delta -= 360;
        if (delta < -180) delta += 360;
        const steps = Math.round(delta);
        if (steps === 0) return '';
        const event = steps > 0 ? '(>K:VOR2_OBI_INC)' : '(>K:VOR2_OBI_DEC)';
        return Array(Math.abs(steps)).fill(event).join(' ');
