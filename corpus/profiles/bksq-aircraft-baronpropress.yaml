        ? '(A:CIRCUIT CONNECTION ON:29, Bool) 0 == if{ 29 2 (>K:2:ELECTRICAL_BUS_TO_CIRCUIT_CONNECTION_TOGGLE) }'
        : '(A:CIRCUIT CONNECTION ON:29, Bool) 1 == if{ 29 2 (>K:2:ELECTRICAL_BUS_TO_CIRCUIT_CONNECTION_TOGGLE) }'

