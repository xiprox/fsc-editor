  # ── CIRCUIT FAILURES WITH NO COCKPIT BREAKER ──────────────────────────────
  # The tablet applies circuit-type failures by disconnecting the circuit from
  # its bus. For circuits that have a breaker on the panel that state is
  # already mirrored by the breakers section above. These 18 have no breaker —
  # de-ice heats, exterior lights, gyro slaving, yoke lights, turbo panel
  # cards — so without these entries the corresponding failures (L/R PITOT
  # HEAT, PROP HEAT, WINDSHIELD HEAT, FUEL VENT HEAT, STALL WARN HEAT, GYRO
  # SLAVING, STROBE/BEACON/NAV/TAXI/LANDING/WING LIGHT and part of the PANEL
  # LIGHTS and CABIN LIGHTS groups) do not reach the other pilot at all.
  #
  # Same shape as the breaker entries: mirror the connection state, guarded so
  # the toggle only fires when the peer actually differs. This mirrors the
  # electrical effect, not the tablet's failure list — the peer's tablet will
  # not show the failure and will not re-assert it.

  # L Pitot Heat — Circuit 29 / Bus 2
