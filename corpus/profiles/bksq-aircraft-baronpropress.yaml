  # ── UNREACHABLE: "type 5" bare K: event failures ──────────────────────────
  # INSTRUMENT AIR, PITOT BLOCKAGE, STATIC BLOCKAGE, L BRAKE, R BRAKE.
  #
  # The tablet fires K:TOGGLE_VACUUM_FAILURE / K:TOGGLE_PITOT_BLOCKAGE /
  # K:TOGGLE_STATIC_PORT_BLOCKAGE / K:TOGGLE_{LEFT,RIGHT}_BRAKE_FAILURE once on
  # each state change and keeps no LVar, so there is nothing to watch.
  #
  # A previous revision inferred the vacuum failure from A:SUCTION PRESSURE
  # < 1.0 inHg. That was removed: suction is also near zero any time the
  # engines are not running, so every engine start and shutdown produced a
  # spurious edge and toggled the peer's vacuum failure the wrong way.
  #
  # Untested candidates, if you want to try them: MSFS exposes PARTIAL PANEL
  # VACUUM and PARTIAL PANEL PITOT ("gauge fail flag"). Whether the Black
  # Square toggles actually move them has not been verified in-sim. Test by
  # triggering each failure from the tablet and watching the variable before
  # wiring anything up.
