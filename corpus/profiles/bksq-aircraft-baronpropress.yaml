  # ═══ CONDITION ════════════════════════════════════════════════════════════
  # Wear state. Accumulated locally by 1 Hz / 5 Hz model-XML loops on BOTH
  # machines — the slave is frozen for position/attitude only, engines and
  # electrics keep simulating — so these drift apart on their own and the
  # aircraft never reconciles them. Persisted by MSFS via systems.cfg
  # [LocalVars], so drift compounds across sessions.
  #
  # Shared with the default set (write the value straight back): last writer
  # wins. Both sides also keep incrementing locally, so expect these to track
  # loosely rather than exactly. Move to `master:` if you want the master to be
  # strictly authoritative.
  #
  # The var_ prefix is mandatory. L:engineFouling_L (no prefix) is a different,
  # unused variable that nothing in the aircraft reads.

  # Engine damage (0–100). At >=100 the model fires K:TOGGLE_ENGINE{n}_FAILURE
  # by itself, and the tablet then refuses to clear that engine's failure.
  - get: L:var_engineDamage_L
  - get: L:var_engineDamage_R

  # Spark plug fouling (0–100). Accumulates below 17 inHg MAP / 160 °C CHT.
