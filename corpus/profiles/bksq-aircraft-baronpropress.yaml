            if{ (A:GPS DRIVES NAV1, Bool) 0 == if{ (>K:TOGGLE_GPS_DRIVES_NAV1) } }
          els{ (L:AS530_CDI_Source_1, Bool) 0 == if{ (>H:AS530_CDI_Push) } }`
        : `(L:XMLVAR_GPS_DISABLED_AS530_1, bool)
            if{ (A:GPS DRIVES NAV1, Bool) 1 == if{ (>K:TOGGLE_GPS_DRIVES_NAV1) } }
          els{ (L:AS530_CDI_Source_1, Bool) 1 == if{ (>H:AS530_CDI_Push) } }`

  # MD41 GPS APR Button
  - get: A:GPS APPROACH MODE, Enum
    set: >
      (() => {
        if (current === value) return '';
        // Only arm/de-arm via button when KLN90B is active
        // Transition to/from armed (1); active (2) is automatic
        if ((value === 1 && current !== 1) || (value === 0 && current === 1)) {
          return '(L:var_radio1Mode, number) 2 == if{ (>H:KLN90B_ApprArm_Push) }';
        }
        return '';
      })()

  # MD41 OBS LEG Button
  - get: A:GPS OBS ACTIVE, Bool
    set: >
      value
        ? '(L:var_radio1Mode, number) 2 == if{ (A:GPS OBS ACTIVE, Bool) 0 == if{ (>K:GPS_OBS) } }'
        : '(L:var_radio1Mode, number) 2 == if{ (A:GPS OBS ACTIVE, Bool) 1 == if{ (>K:GPS_OBS) } }'

  # MD41 Test Button
